name: Godot validation

on:
  push:
    branches: [protocol-newborn-godot]
  pull_request:
    branches: [protocol-newborn-godot]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test offline generated asset pipeline
        run: |
          python -m unittest discover -s tests -p 'test_asset_pipeline.py' -v
          python tools/asset_pipeline.py check-manifest
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Run project startup
        run: timeout 30s godot --headless --path . --quit-after 5
      - name: Verify Android orientation is locked to landscape
        run: timeout 30s godot --headless --path . --script tests/orientation_test.gd
      - name: Verify background NavigationMesh bake
        run: timeout 45s godot --headless --path . --script tests/navmesh_director_test.gd
      - name: Run inventory, healing and safe storage tests
        run: timeout 30s godot --headless --path . --script tests/game_state_test.gd
      - name: Run hunter safe-room and hiding tests
        run: timeout 30s godot --headless --path . --script tests/ai_safe_zone_test.gd
      - name: Run mobile touch layout and multitouch tests
        run: timeout 30s godot --headless --path . --script tests/mobile_controls_test.gd
      - name: Run campaign puzzle and progression tests
        run: timeout 30s godot --headless --path . res://tests/campaign_puzzle_test.tscn
      - name: Run seven chapter exploration map tests
        run: timeout 30s godot --headless --path . res://tests/exploration_map_test.tscn
      - name: Run world map navigation and topology tests
        run: timeout 30s godot --headless --path . --script tests/world_map_navigation_test.gd
